[env:proton]
platform = https://github.com/norandomtechie/platform-raspberrypi#feature/proton-picosdk-support
board = proton
framework = picosdk
build_src_flags = -O0
debug_tool = picoprobe
upload_protocol = picoprobe
monitor_speed = 115200

[env:sound_test]
extends = env:proton
build_src_filter = -<*> +<sound.c> +<sound_test.c>
; Change to -DAUTO_DEMO=0 to boot silent (press button A to play sounds by hand)
build_flags = -DAUDIO_PIN=14 -DAUTO_DEMO=1